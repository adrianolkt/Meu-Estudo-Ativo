        // Mostra só uma caixa Leitner de cada vez no modo de estudo padrão,
        // priorizando a Caixa 1, depois a Caixa 2, e assim por diante.
        // Retorna true se conseguiu revelar alguma caixa com cartões pendentes.
        let ultimaCaixaMostrada = null;

        function atualizarIconeCaixaAtual(caixa) {
            const el = document.getElementById('leitnerCaixaAtual');
            if (!el) return;
            if (caixa && caixa >= 1 && caixa <= 5) {
                el.textContent = LEITNER_ICONES[caixa - 1];
                el.title = `Estudando a Caixa ${caixa}`;
                el.style.display = 'inline';
            } else {
                el.style.display = 'none';
            }
        }

        function aplicarPrioridadeLeitner() {
            if (modoAtual !== 'padrao') return false;

            let menorCaixa = null;

            if (caixaSessaoRestrita) {
                // Sessão restrita a uma única caixa (via botão Resetar): só considera
                // essa caixa específica — não avança pra outra mesmo que ela esvazie.
                const temPendenteNaCaixa = Object.keys(flashcards).some(id => {
                    const card = flashcards[id];
                    return card.assuntoId === assuntoAtualId && card.estado === 0
                        && (card.caixaLeitner || 1) === caixaSessaoRestrita;
                });
                menorCaixa = temPendenteNaCaixa ? caixaSessaoRestrita : null;
            } else {
                // Descobre a menor caixa com cartões ainda pendentes (estado 0) neste assunto
                for (const id in flashcards) {
                    const card = flashcards[id];
                    if (card.assuntoId !== assuntoAtualId || card.estado !== 0) continue;
                    const caixa = card.caixaLeitner || 1;
                    if (menorCaixa === null || caixa < menorCaixa) menorCaixa = caixa;
                }
            }

            if (menorCaixa === null) {
                atualizarIconeCaixaAtual(null);
                return false;
            }

            // Reconstrói o mapa do zero (igual ao Revisar Erradas) e mantém só os
            // cartões pendentes da caixa prioritária; os demais são removidos da
            // visualização até chegar a vez deles.
            jm.show(JSON.parse(original_mind_data_atual));
            jm.collapse_all();
            jm.expand_node('root');

            let algumVisivel = false;
            for (const nodeId in flashcards) {
                const card = flashcards[nodeId];
                if (card.assuntoId !== assuntoAtualId) continue;
                const nodeObj = jm.get_node(nodeId);
                if (!nodeObj) continue;

                if (card.estado === 2 || card.estado === 3 || card.isErro) {
                    jm.remove_node(nodeId);
                    continue;
                }

                const caixa = card.caixaLeitner || 1;
                if (caixa === menorCaixa) {
                    jm.update_node(nodeId, card.dica);
                    algumVisivel = true;
                } else {
                    jm.remove_node(nodeId);
                }
            }

            limparPastasVazias();

            if (algumVisivel && menorCaixa !== ultimaCaixaMostrada) {
                ultimaCaixaMostrada = menorCaixa;
                atualizarIconeCaixaAtual(menorCaixa);
                mostrarToast(`${LEITNER_ICONES[menorCaixa - 1]} Estudando a Caixa ${menorCaixa}`, '#4a5568');
            } else if (!algumVisivel) {
                atualizarIconeCaixaAtual(null);
            }

            return algumVisivel;
        }

        function obterProximoCartao() {
            for (const id in flashcards) {
                if (flashcards[id].assuntoId === assuntoAtualId && flashcards[id].estado === 0) {
                    const nodeObj = jm.get_node(id);
                    if (nodeObj) return id;
                }
            }

            // Nenhum cartão pendente no mapa atual: tenta revelar a próxima caixa Leitner
            if (aplicarPrioridadeLeitner()) {
                for (const id in flashcards) {
                    if (flashcards[id].assuntoId === assuntoAtualId && flashcards[id].estado === 0) {
                        const nodeObj = jm.get_node(id);
                        if (nodeObj) return id;
                    }
                }
            }
            return null;
        }

        function atualizarProgresso() {
            let total = 0;
            let acertos = 0;
            
            for (const key in flashcards) {
                if (flashcards[key].assuntoId !== assuntoAtualId) continue;

                if (modoAtual === 'espacada' || modoAtual === 'erradas' || modoAtual === 'frequentes') {
                    if (flashcards[key].emSessao) {
                        total++;
                        if (flashcards[key].estado === 2) acertos++;
                    }
                } else if (modoAtual === 'padrao' && caixaSessaoRestrita) {
                    if (flashcards[key].emSessao) {
                        total++;
                        if (flashcards[key].estado === 2) acertos++;
                    }
                } else {
                    total++;
                    if (flashcards[key].estado === 2) acertos++;
                }
            }

            if (total === 0) {
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').textContent = `(0%)`;
                return;
            }

            const porcentagem = Math.round((acertos / total) * 100);
            document.getElementById('progressBar').style.width = porcentagem + '%';
            document.getElementById('progressText').textContent = `(${porcentagem}%)`;

            if (porcentagem === 100 && !confeteDisparado) {
                confeteDisparado = true;
                const audioEl = document.getElementById('somPalmas');
                audioEl.volume = 1.0;
                audioEl.currentTime = 0; 
                const playPromise = audioEl.play();
                if (playPromise !== undefined) {
                    playPromise.catch(erro => console.log("Áudio bloqueado:", erro));
                }

                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, zIndex: 9999 });

                const rootNode = jm.get_node('root');
                if (rootNode && !rootNode.topic.startsWith('✅')) {
                    jm.update_node('root', '✅ ' + rootNode.topic);
                    jm.set_node_color('root', '#38a169', '#fff'); 
                }
                
                if (modoAtual === 'espacada') {
                    document.getElementById('btnEspacada').style.display = 'none';
                    setTimeout(() => { mostrarToast("🏆 Revisão Completa! Bom trabalho!", "#3182ce"); }, 500);
                } else if (modoAtual === 'erradas') {
                    document.getElementById('btnRevisarErradas').style.display = 'none';
                    setTimeout(() => { mostrarToast("🏆 Erros imediatos corrigidos!", "#dd6b20"); }, 500);
                } else if (modoAtual === 'frequentes') {
                    document.getElementById('btnRevisarFrequentes').style.display = 'none';
                    setTimeout(() => { mostrarToast("🏆 Revisão de véspera concluída!", "#805ad5"); }, 500);
                } else if (caixaSessaoRestrita) {
                    setTimeout(() => { mostrarToast(`🏆 ${LEITNER_ICONES[caixaSessaoRestrita - 1]} Caixa ${caixaSessaoRestrita} concluída!`, "#d69e2e"); }, 500);
                } else {
                    setTimeout(() => { mostrarToast("🏆 Parabéns! Você dominou o conteúdo!", "#d69e2e"); }, 500);
                }

                setTimeout(() => { 
                    const disciplinaId = document.getElementById('seletorDisciplina').value;
                    atualizarMenuAssuntos(disciplinaId, true);
                    aplicarEstadoConcluido(); 
                }, 3500);
            }
        }

        function aplicarEstadoConcluido() {
            isCompletado = true;
            caixaSessaoRestrita = null;
            jm.collapse_all();
            document.getElementById('painel-revelar').style.display = 'none';
            mostrarToast("Sessão finalizada. Use o botão ↻ Resetar para recomeçar.", "#38a169");
        }

        document.getElementById('jsmind_container').addEventListener('dblclick', (e) => { e.preventDefault(); e.stopPropagation(); }, true);

        function processarToqueNoNo(noValidado) {
            const nodeId = noValidado.getAttribute('nodeid');
            const nodeObj = jm.get_node(nodeId);

            if (noEmAvaliacao && noEmAvaliacao !== nodeId) {
                const cardAntigo = flashcards[noEmAvaliacao];
                if(cardAntigo) {
                    cardAntigo.estado = 0; 
                    const nodeAntigoExiste = jm.get_node(noEmAvaliacao);
                    if(nodeAntigoExiste) {
                        if (modoAtual === 'frequentes' && aindaEhPontoFraco(cardAntigo)) {
                            jm.set_node_color(noEmAvaliacao, "#805ad5", "#fff");
                            const cleanDica = cardAntigo.dica.replace(/^.*? /, '');
                            jm.update_node(noEmAvaliacao, `[${cardAntigo.errosCount}x] 🚨 ` + cleanDica);
                        } else if (modoAtual === 'espacada' && cardAntigo.emSessao) {
                            jm.set_node_color(noEmAvaliacao, "#3182ce", "#fff");
                            const cleanDica = cardAntigo.dica.replace(/^.*? /, '');
                            jm.update_node(noEmAvaliacao, "⏳ " + cleanDica);
                        } else if (modoAtual === 'erradas' && cardAntigo.emSessao) {
                            jm.set_node_color(noEmAvaliacao, "#e53e3e", "#fff");
                            const cleanDica = cardAntigo.dica.replace(/^.*? /, '');
                            jm.update_node(noEmAvaliacao, "🔄 " + cleanDica);
                        } else if (cardAntigo.estado === 3 || cardAntigo.isErro) {
                            jm.set_node_color(noEmAvaliacao, "#e53e3e", "#fff");
                            const cleanDica = cardAntigo.dica.replace(/^.*? /, '');
                            jm.update_node(noEmAvaliacao, "❌ " + cleanDica);
                        } else {
                            jm.set_node_color(noEmAvaliacao, "#dd6b20", "#fff");
                            jm.update_node(noEmAvaliacao, cardAntigo.dica);
                        }
                    }
                }
                alternarPaineis('padrao');
                noEmAvaliacao = null;
            }
            
            if (flashcards[nodeId]) {
                const card = flashcards[nodeId];
                card.estado = 1; 
                jm.update_node(nodeId, card.dica);
                jm.set_node_color(nodeId, "#2c3e50", "#fff"); 
                jm.select_node(nodeId); 
                noEmAvaliacao = nodeId;
                if (modoAtual === 'padrao') atualizarIconeCaixaAtual(card.caixaLeitner || 1);
                alternarPaineis('revelar');
            } else {
                if (nodeObj && nodeObj.children && nodeObj.children.length > 0) {
                    if (!nodeObj.expanded && nodeObj.parent) {
                        const parentObj = nodeObj.parent;
                        for (let i = 0; i < parentObj.children.length; i++) {
                            const irmao = parentObj.children[i];
                            if (irmao.id !== nodeId && irmao.expanded) {
                                jm.collapse_node(irmao.id);
                            }
                        }
                    }
                    jm.toggle_node(nodeId);
                }
                jm.select_node(nodeId);

        // ---- Mapeamento de cores (modo Progresso) ----

        function calcularEstatisticasTopico(topico) {
            let total = 0, acertos = 0, respondidos = 0, errosTotais = 0, acertosTotais = 0;
            topico.cartoes.forEach(cartao => {
                const card = flashcards[cartao.id];
                if (!card) return;
                total++;
                if (card.estado === 2) acertos++;
                if (card.jaRespondido) respondidos++;
                errosTotais   += (card.errosCount   || 0);
                acertosTotais += (card.acertosConta || 0);
            });
            const totalRespostas = errosTotais + acertosTotais;
            const percentual = totalRespostas > 0
                ? Math.round((acertosTotais / totalRespostas) * 100) : 0;
            return { total, acertos, respondidos, errosTotais, acertosTotais, percentual };
        }

        function corSaudeTopico(percentual, errosTotais, total, respondidos) {
            if (total === 0) return "hsla(210, 10%, 70%, 0.12)";
            const hue = Math.round((percentual / 100) * 120);
            const mediaErros = errosTotais / total;
            const luminosidade = Math.max(32, 50 - Math.min(mediaErros, 5) * 3);
            const alpha = 0.12 + (respondidos / total) * 0.88;
            return `hsla(${hue}, 68%, ${luminosidade}%, ${alpha.toFixed(2)})`;
        }

        function corSaudeCartao(card) {
            if (!card || !card.jaRespondido) return "#fbd38d";
            const erros   = card.errosCount   || 0;
            const acertos = card.acertosConta || 0;
            const totalR  = erros + acertos;
            if (totalR === 0) return "#fbd38d";
            const taxa = acertos / totalR;
            if (taxa >= 1)   return "#68d391";
            if (taxa >= 0.7) return "#fc8181";
            if (taxa >= 0.4) return "#f56565";
            if (taxa >= 0.2) return "#e53e3e";
            return "#c53030";
        }

        function aplicarMapeamentoCores() {
            if (!assuntoCarregado) return;

            assuntoCarregado.topicos.forEach(topico => {
                const topicoNode = jm.get_node(topico.id);
                if (!topicoNode) return;

                const stats = calcularEstatisticasTopico(topico);
                const cor = corSaudeTopico(stats.percentual, stats.errosTotais, stats.total, stats.respondidos);
                const corTexto = (stats.respondidos / stats.total) < 0.5 ? "#2d3748" : "#fff";
                jm.set_node_color(topico.id, cor, corTexto);

                topico.cartoes.forEach(cartao => {
                    const nodeObj = jm.get_node(cartao.id);
                    if (!nodeObj) return;
                    const card = flashcards[cartao.id];
                    const acertos = card.acertosConta || 0;
                    const erros   = card.errosCount   || 0;
                    const cleanDica = cartao.dica.replace(/^.*? /, '');
                    let label = cleanDica;
                    if (acertos > 0 || erros > 0) {
                        label = `✅${acertos} ❌${erros}  ${cleanDica}`;
                    }
                    jm.update_node(cartao.id, label);
                    jm.set_node_color(cartao.id, corSaudeCartao(card), "#2d3748");
                });
            });
        }

            if (modoAtual === 'espacada' && confeteDisparado) mostrarBotaoEspacada = false;
            if (modoAtual === 'erradas' && confeteDisparado) mostrarBotaoErradas = false;
            if (modoAtual === 'frequentes' && confeteDisparado) mostrarBotaoFrequentes = false;

            // Mostra só um botão de cada vez, por ordem de prioridade:
            // 1º Revisão Espaçada, 2º Revisar Erradas, 3º Maior Dificuldade
            if (mostrarBotaoEspacada) {
                mostrarBotaoErradas = false;
                mostrarBotaoFrequentes = false;
            } else if (mostrarBotaoErradas) {
                mostrarBotaoFrequentes = false;
            }

            const btnEspacada = document.getElementById('btnEspacada');

            btnErradas.style.display = mostrarBotaoErradas ? 'inline-block' : 'none';
            btnFrequentes.style.display = mostrarBotaoFrequentes ? 'inline-block' : 'none';

            if (mostrarBotaoFrequentes && !jaVisivelFrequentes) btnFrequentes.focus();
            if (mostrarBotaoErradas && !jaVisivelErradas) btnErradas.focus();
            if (mostrarBotaoEspacada && !jaVisivelEspacada) btnEspacada.focus();
        }

        // Dados salvos ficam em memória até os cartões serem carregados
        let progressoSalvo = {};

        function reconstruirFlashcardsDoProgressoSalvo() {
            for (const id in progressoSalvo) {
                const saved = progressoSalvo[id];
                if (!saved || !saved.assuntoId || saved.assuntoId === '_orphan') continue;

                if (!flashcards[id]) {
                    flashcards[id] = {
                        assuntoId: saved.assuntoId,
                        estado: saved.estado ?? 0,
                        proximaRevisao: saved.proximaRevisao ?? 0,
                        jaRespondido: saved.jaRespondido ?? false,
                        emSessao: false,
                        isErro: saved.isErro ?? false,
                        errosCount: saved.errosCount ?? 0,
                        acertosConta: saved.acertosConta ?? 0,
                        ultimaResposta: saved.ultimaResposta ?? null,
                        caixaLeitner: saved.caixaLeitner ?? 1,
                        ultimaMudancaCaixa: saved.ultimaMudancaCaixa || 0,
                        passoEspacado: saved.passoEspacado || 0,
                        acertosSeguidos: saved.acertosSeguidos || 0,
                        ultimoDiaAcertoContado: saved.ultimoDiaAcertoContado || 0,
                        caixaPendente: saved.caixaPendente ?? null,
                        diaRespondido: saved.diaRespondido || 0,
                        dica: '', conteudo: ''
                    };
                }
            }
        }

        // Metadados de cada assunto (total de cartões) e mapa cartão→assunto,
        // carregados uma vez no início a partir dos arquivos reais de cada assunto
        // (via <script src>, que funciona normalmente mesmo em file://, ao contrário de fetch()).
        let totalCartoesPorAssunto = {};
        let mapaCartaoAssunto = {};
        let metadadosCarregados = false;

        function carregarMetadadosAssuntos(callback) {
            const fila = [];
            CATALOGO.forEach(ctx => {
                (ctx.disciplinas || []).forEach(disc => {
                    (disc.assuntos || []).forEach(ass => {
                        fila.push({ assuntoId: ass.id, arquivo: ass.arquivo });
                    });
                });
            });

            if (fila.length === 0) {
                metadadosCarregados = true;
                callback();
                return;
            }

            let indice = 0;

            function carregarProximo() {
                if (indice >= fila.length) {
                    metadadosCarregados = true;
                    callback();
                    return;
                }

                const item = fila[indice++];
                const script = document.createElement('script');
                script.src = item.arquivo + '?v=' + Date.now();
                script.onload = () => {
                    if (typeof MEU_ASSUNTO !== 'undefined' && MEU_ASSUNTO && MEU_ASSUNTO.topicos) {
                        let total = 0;
                        MEU_ASSUNTO.topicos.forEach(topico => {
                            (topico.cartoes || []).forEach(cartao => {
                                total++;
                                mapaCartaoAssunto[cartao.id] = item.assuntoId;
                            });
                        });
                        totalCartoesPorAssunto[item.assuntoId] = total;
                    }
                    script.remove();
                    try { delete window.MEU_ASSUNTO; } catch (e) { window.MEU_ASSUNTO = undefined; }
                    carregarProximo();
                };
                script.onerror = () => {
                    script.remove();
                    carregarProximo();
                };
                document.head.appendChild(script);
            }

            carregarProximo();
        }

        function migrarAssuntoIdNoProgresso(assuntoId) {
            if (!assuntoCarregado) return false;
            let alterou = false;

            assuntoCarregado.topicos.forEach(topico => {
                topico.cartoes.forEach(cartao => {
                    if (progressoSalvo[cartao.id] && !progressoSalvo[cartao.id].assuntoId) {
                        progressoSalvo[cartao.id].assuntoId = assuntoId;
                        alterou = true;
                    }
                });
            });

            if (alterou) {
                localStorage.setItem('estudo_ativo_global_v5', JSON.stringify(progressoSalvo));
            }
            return alterou;
        }

        function migrarProgressoLegado(callback) {
            const idsSemAssunto = Object.keys(progressoSalvo).filter(id => !progressoSalvo[id].assuntoId);
            if (idsSemAssunto.length === 0) {
                callback();
                return;
            }

            let alterou = false;
            idsSemAssunto.forEach(id => {
                progressoSalvo[id].assuntoId = mapaCartaoAssunto[id] || '_orphan';
                alterou = true;
            });

            if (alterou) {
                localStorage.setItem('estudo_ativo_global_v5', JSON.stringify(progressoSalvo));
            }
            callback();
        }

        function inicializarProgressoPersistido(callback) {
            // Garante que os metadados (totais por assunto + mapa cartão→assunto)
            // já estejam carregados antes de migrar/reconstruir o progresso
            carregarMetadadosAssuntos(() => {
                migrarProgressoLegado(() => {
                    aplicarMudancasCaixaPendentesGlobal();
                    reconstruirFlashcardsDoProgressoSalvo();
                    callback();
                });
            });
        }

        function salvarProgressoLocal(forcarEstadoAtual = false) {
            const dataToSave = {};
            for (let id in flashcards) {
                const card = flashcards[id];
                // Só salva estado=2 (acertou) se realmente acertou nesta sessão.
                // Para estado=0, normalmente preserva o que já estava salvo (evita que uma
                // simples troca de assunto apague progresso). Mas quando forcarEstadoAtual=true
                // (usado pelo botão Resetar), grava o 0 mesmo assim.
                const estadoSalvo = card.estado === 2 ? 2
                    : card.estado === 3 ? 3
                    : forcarEstadoAtual ? 0
                    : (progressoSalvo[id] ? progressoSalvo[id].estado : 0);

                dataToSave[id] = {
                    assuntoId:      card.assuntoId,
                    estado:         estadoSalvo,
                    proximaRevisao: card.proximaRevisao,
                    jaRespondido:   card.jaRespondido,
                    isErro:         card.isErro,
                    errosCount:     card.errosCount,
                    acertosConta:   card.acertosConta || 0,
                    ultimaResposta: card.ultimaResposta ?? null,
                    caixaLeitner: card.caixaLeitner || 1,
                    ultimaMudancaCaixa: card.ultimaMudancaCaixa || 0,
                    passoEspacado: card.passoEspacado || 0,
                    acertosSeguidos: card.acertosSeguidos || 0,
                    ultimoDiaAcertoContado: card.ultimoDiaAcertoContado || 0,
                    caixaPendente: card.caixaPendente ?? null,
                    diaRespondido: card.diaRespondido || 0
                };
            }
            const merged = Object.assign({}, progressoSalvo, dataToSave);
            progressoSalvo = merged;
            localStorage.setItem('estudo_ativo_global_v5', JSON.stringify(merged));
        }

        function carregarProgressoLocal() {
            const savedString = localStorage.getItem('estudo_ativo_global_v5');
            if (savedString) {
                try {
                    progressoSalvo = JSON.parse(savedString);
                } catch (err) {
                    console.error("Erro ao carregar progresso local:", err);
                    progressoSalvo = {};
                }
            }
        }

        // Aplica o progresso salvo nos flashcards recém-registrados de um assunto
        function aplicarProgressoSalvo(assuntoId) {
            for (let id in flashcards) {
                if (flashcards[id].assuntoId !== assuntoId) continue;
                if (progressoSalvo[id]) {
                    flashcards[id].estado         = progressoSalvo[id].estado ?? 0;
                    flashcards[id].proximaRevisao = progressoSalvo[id].proximaRevisao ?? 0;
                    flashcards[id].jaRespondido   = progressoSalvo[id].jaRespondido ?? false;
                    flashcards[id].isErro         = progressoSalvo[id].isErro ?? false;
                    flashcards[id].errosCount     = progressoSalvo[id].errosCount ?? 0;
                    flashcards[id].acertosConta   = progressoSalvo[id].acertosConta ?? 0;
                    flashcards[id].ultimaResposta = progressoSalvo[id].ultimaResposta ?? null;
                    flashcards[id].caixaLeitner   = progressoSalvo[id].caixaLeitner ?? 1;
                    flashcards[id].ultimaMudancaCaixa = progressoSalvo[id].ultimaMudancaCaixa || 0;
                    flashcards[id].passoEspacado = progressoSalvo[id].passoEspacado || 0;
                    flashcards[id].acertosSeguidos = progressoSalvo[id].acertosSeguidos || 0;
                    flashcards[id].ultimoDiaAcertoContado = progressoSalvo[id].ultimoDiaAcertoContado || 0;
                    flashcards[id].caixaPendente = progressoSalvo[id].caixaPendente ?? null;
                    flashcards[id].diaRespondido = progressoSalvo[id].diaRespondido || 0;
                }
            }
        }

        function sincronizarMapaComEstadoLocal() {
            jm.show(JSON.parse(original_mind_data_atual));
            jm.collapse_all();
            jm.expand_node('root');
            
            for (const nodeId in flashcards) {
                if (flashcards[nodeId].assuntoId !== assuntoAtualId) continue;

                const card = flashcards[nodeId];
                const nodeObj = jm.get_node(nodeId);
                
                if (card.estado === 2) {
                    if (nodeObj) { try { jm.remove_node(nodeId); } catch(e){} }
                } else if (card.estado === 3 || card.isErro) {
                    if (nodeObj) { try { jm.remove_node(nodeId); } catch(e){} }
                } else if (card.estado === 0 && nodeObj) {
                    jm.update_node(nodeId, card.dica);
                }
            }
            limparPastasVazias();
            
            if (verificarAssuntoConcluido(assuntoAtualId)) {
                confeteDisparado = true; 
                isCompletado = true;
                const rootNode = jm.get_node('root');
                if (rootNode && !rootNode.topic.startsWith('✅')) {
                    jm.update_node('root', '✅ ' + rootNode.topic);
                    jm.set_node_color('root', '#38a169', '#fff'); 
                }
                // Esconde o botão "Iniciar", já que não há mais nada pendente neste assunto
                document.getElementById('painel-revelar').style.display = 'none';
                document.getElementById('painel-avaliacao').style.display = 'none';
            } else {
                jm.select_node('root'); 
            }

            atualizarProgresso();
            verificarBotoesRevisao();

            // Aplica a prioridade por caixa Leitner (mostra só a caixa mais baixa pendente)
            setTimeout(() => aplicarPrioridadeLeitner(), 60);
        }

        window.onload = function() {
            inicializarSistema();
            const btnSpacebar = document.getElementById('btnRevelar');
            if (btnSpacebar) {
                setTimeout(() => btnSpacebar.focus(), 100);
            }

            // OBSERVER: Garante que a extensão de texto (quebra de linha e largura)
            // seja aplicada SOMENTE aos cartões (folhas) e não às pastas/tópicos.
            function aplicarEstiloCartoes(nodeList) {
                nodeList.forEach(n => {
                    const id = n.getAttribute('nodeid');
                    // Se o id estiver no dicionário de flashcards, é um cartão!
                    if (flashcards && flashcards[id]) {
                        n.classList.add('cartao-flashcard');
                    }
                });
            }

            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    mutation.addedNodes.forEach((node) => {
                        if (node.nodeType === 1) { 
                            if (node.tagName && node.tagName.toLowerCase() === 'jmnode') {
                                aplicarEstiloCartoes([node]);
                            } else if (node.querySelectorAll) {
                                aplicarEstiloCartoes(node.querySelectorAll('jmnode'));
                            }
                        }
                    });
                });
            });

            const container = document.getElementById('jsmind_container');
            if (container) {
                observer.observe(container, { childList: true, subtree: true });
                // Força a aplicação inicial nos cartões que já renderizaram
                aplicarEstiloCartoes(container.querySelectorAll('jmnode'));
            }
        };

        document.addEventListener('keydown', function(e) {
            if (e.code !== 'Space' && e.key !== ' ') return;

            const tagAtiva = document.activeElement ? document.activeElement.tagName : '';
            if (tagAtiva === 'SELECT' || tagAtiva === 'INPUT' || tagAtiva === 'TEXTAREA') return;

            const painelRevelar = document.getElementById('painel-revelar');
            const painelAvaliacao = document.getElementById('painel-avaliacao');
            const btnRevelar = document.getElementById('btnRevelar');
            const btnAcertei = document.getElementById('btnAcertei');

            if (btnRevelar && painelRevelar && painelRevelar.style.display !== 'none') {
                e.preventDefault();
                btnRevelar.click();
                btnRevelar.focus();
            } else if (btnAcertei && painelAvaliacao && painelAvaliacao.style.display !== 'none') {
                e.preventDefault();
                btnAcertei.click();
                btnAcertei.focus();
            }
        });

    </script>

    <script>
        // ============================================================
        // POMODORO — lógica (temporizador com anel de progresso,
        // ciclos foco/pausa, persistência e som ao concluir)
        // ============================================================

        const POMODORO_CORES = {
            foco: '#e53e3e',
            pausaCurta: '#38a169',
            pausaLonga: '#3182ce'
        };
        const POMODORO_LABELS = {
            foco: '🍅 Foco',
            pausaCurta: '☕ Pausa Curta',
            pausaLonga: '🛋️ Pausa Longa'
        };
        const POMODORO_RAIO = 98;
        const POMODORO_CIRCUNFERENCIA = 2 * Math.PI * POMODORO_RAIO;

        let pomodoroConfig = { foco: 25, pausaCurta: 5, pausaLonga: 15, ciclos: 4, som: true, autoIniciar: false };
        let pomodoroEstado = { modo: 'foco', cicloAtual: 1, restanteMs: 25 * 60 * 1000, rodando: false, fimTimestamp: null, ultimaAtividadeDia: 0 };
        let pomodoroIntervalId = null;

        function duracaoModoPomodoroMs(modo) {
            const minutos = modo === 'foco' ? pomodoroConfig.foco
                : modo === 'pausaCurta' ? pomodoroConfig.pausaCurta
                : pomodoroConfig.pausaLonga;
            return Math.max(1, minutos) * 60 * 1000;
        }

        function salvarEstadoPomodoro() {
            const paraSalvar = Object.assign({}, pomodoroEstado);
            // Se estiver rodando, salva o timestamp de término em vez do restante (mais preciso)
            localStorage.setItem('estudo_ativo_pomodoro_estado', JSON.stringify(paraSalvar));
        }

        // Se a última atividade do Pomodoro foi num dia lógico diferente de hoje (vira
        // às 4h, igual ao resto do app), zera o ciclo/sessões — não deixa a contagem de
        // "sessões de ontem" acumular pro dia novo. Não mexe se um timer estiver rodando
        // no momento (evita cortar uma sessão em andamento por causa da virada do dia).
        function verificarNovoDiaPomodoro() {
            const agora = Date.now();
            const mesmoDia = estaNoMesmoDiaLeitner(pomodoroEstado.ultimaAtividadeDia, agora);
            if (!mesmoDia && !pomodoroEstado.rodando) {
                pomodoroEstado.cicloAtual = 1;
                pomodoroEstado.modo = 'foco';
                pomodoroEstado.restanteMs = duracaoModoPomodoroMs('foco');
                pomodoroEstado.fimTimestamp = null;
                salvarEstadoPomodoro();
            }
            pomodoroEstado.ultimaAtividadeDia = agora;
        }

        function carregarPomodoro() {
            try {
                const cfgSalva = JSON.parse(localStorage.getItem('estudo_ativo_pomodoro_config') || 'null');
                if (cfgSalva) pomodoroConfig = Object.assign(pomodoroConfig, cfgSalva);
            } catch(e) {}

            try {
                const estadoSalvo = JSON.parse(localStorage.getItem('estudo_ativo_pomodoro_estado') || 'null');
                if (estadoSalvo) {
                    pomodoroEstado = Object.assign(pomodoroEstado, estadoSalvo);
                    if (pomodoroEstado.rodando && pomodoroEstado.fimTimestamp) {
                        const restanteAgora = pomodoroEstado.fimTimestamp - Date.now();
                        if (restanteAgora <= 0) {
                            // Terminou enquanto o app estava fechado: aplica a conclusão e para
                            pomodoroEstado.rodando = false;
                            pomodoroEstado.restanteMs = 0;
                            finalizarSessaoPomodoro(true);
                        } else {
                            pomodoroEstado.restanteMs = restanteAgora;
                            iniciarIntervaloPomodoro();
                        }
                    }
                }
            } catch(e) {}

            verificarNovoDiaPomodoro();
            atualizarDisplayPomodoro();
        }

        function formatarTempoPomodoro(ms) {
            const totalSeg = Math.max(0, Math.ceil(ms / 1000));
            const min = Math.floor(totalSeg / 60);
            const seg = totalSeg % 60;
            return `${String(min).padStart(2,'0')}:${String(seg).padStart(2,'0')}`;
        }

        function atualizarDisplayPomodoro() {
            const total = duracaoModoPomodoroMs(pomodoroEstado.modo);
            const restante = Math.max(0, Math.min(pomodoroEstado.restanteMs, total));
            const progresso = total > 0 ? restante / total : 0;

            const tempoTexto = formatarTempoPomodoro(restante);
            const timeEl = document.getElementById('pomodoroTime');
            if (timeEl) timeEl.textContent = tempoTexto;

            const ring = document.getElementById('pomodoroRingFg');
            if (ring) {
                ring.style.stroke = POMODORO_CORES[pomodoroEstado.modo];
                ring.style.strokeDasharray = `${POMODORO_CIRCUNFERENCIA}`;
                ring.style.strokeDashoffset = `${POMODORO_CIRCUNFERENCIA * (1 - progresso)}`;
            }

            const label = document.getElementById('pomodoroModeLabel');
            if (label) {
                label.textContent = POMODORO_LABELS[pomodoroEstado.modo];
                label.classList.toggle('modo-pausa', pomodoroEstado.modo !== 'foco');
            }

            const btn = document.getElementById('pomodoroBtnPrincipal');
            if (btn) btn.textContent = pomodoroEstado.rodando ? '⏸ Pausar' : '▶ Iniciar';

            // Bolinhas de progresso do ciclo (🍅 preenchido = sessão de foco concluída)
            const dotsEl = document.getElementById('pomodoroDots');
            if (dotsEl) {
                dotsEl.innerHTML = '';
                const ciclos = Math.max(1, pomodoroConfig.ciclos);
                const concluidosNoCiclo = ((pomodoroEstado.cicloAtual - 1) % ciclos + ciclos) % ciclos;
                for (let i = 0; i < ciclos; i++) {
                    const dot = document.createElement('span');
                    dot.className = 'pomodoro-dot' + (i < concluidosNoCiclo ? ' completo' : '');
                    dot.textContent = '🍅';
                    dotsEl.appendChild(dot);
                }
            }

            // Botão flutuante: mostra o tempo restante quando rodando
            const fab = document.getElementById('pomodoroFab');
            if (fab) {
                if (pomodoroEstado.rodando) {
                    fab.textContent = tempoTexto;
                    fab.classList.add('pomodoro-fab-rodando');
                    fab.style.background = `linear-gradient(135deg, ${POMODORO_CORES[pomodoroEstado.modo]}, ${POMODORO_CORES[pomodoroEstado.modo]})`;
                } else {
                    fab.textContent = '🍅';
                    fab.classList.remove('pomodoro-fab-rodando');
                    fab.style.background = 'linear-gradient(135deg, #e53e3e, #c53030)';
                }
            }
        }

        function iniciarIntervaloPomodoro() {
            if (pomodoroIntervalId) clearInterval(pomodoroIntervalId);
            pomodoroIntervalId = setInterval(tickPomodoro, 250);
        }

        function tickPomodoro() {
            if (!pomodoroEstado.rodando || !pomodoroEstado.fimTimestamp) return;
            const restante = pomodoroEstado.fimTimestamp - Date.now();
            if (restante <= 0) {
                pomodoroEstado.restanteMs = 0;
                finalizarSessaoPomodoro(true);
            } else {
                pomodoroEstado.restanteMs = restante;
                atualizarDisplayPomodoro();
            }
        }

        function tocarSomPomodoro() {
            if (!pomodoroConfig.som) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                [0, 0.22, 0.44].forEach((delay, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = i === 2 ? 987.77 : 783.99; // beep agudo no final
                    gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + delay + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.18);
                    osc.start(ctx.currentTime + delay);
                    osc.stop(ctx.currentTime + delay + 0.2);
                });
            } catch(e) { /* Web Audio indisponível — ignora silenciosamente */ }
        }

        function finalizarSessaoPomodoro(disparadoPorConclusao) {
            if (pomodoroIntervalId) { clearInterval(pomodoroIntervalId); pomodoroIntervalId = null; }

            const modoAnterior = pomodoroEstado.modo;
            if (disparadoPorConclusao) tocarSomPomodoro();

            if (modoAnterior === 'foco') {
                const proximoCiclo = pomodoroEstado.cicloAtual + 1;
                const ehPausaLonga = (pomodoroEstado.cicloAtual % Math.max(1, pomodoroConfig.ciclos)) === 0;
                pomodoroEstado.cicloAtual = proximoCiclo;
                pomodoroEstado.modo = ehPausaLonga ? 'pausaLonga' : 'pausaCurta';
                if (disparadoPorConclusao) mostrarToast('🍅 Foco concluído! Hora da pausa.', POMODORO_CORES.pausaCurta);
            } else {
                pomodoroEstado.modo = 'foco';
                if (disparadoPorConclusao) mostrarToast('☕ Pausa concluída! De volta ao foco.', POMODORO_CORES.foco);
            }

            pomodoroEstado.restanteMs = duracaoModoPomodoroMs(pomodoroEstado.modo);
            pomodoroEstado.rodando = false;
            pomodoroEstado.fimTimestamp = null;

            if (pomodoroConfig.autoIniciar) {
                iniciarPomodoro();
            } else {
                atualizarDisplayPomodoro();
                salvarEstadoPomodoro();
            }
        }

        function iniciarPomodoro() {
            pomodoroEstado.fimTimestamp = Date.now() + pomodoroEstado.restanteMs;
            pomodoroEstado.rodando = true;
            iniciarIntervaloPomodoro();
            atualizarDisplayPomodoro();
            salvarEstadoPomodoro();
        }

        function pausarPomodoro() {
            if (pomodoroEstado.fimTimestamp) {
                pomodoroEstado.restanteMs = Math.max(0, pomodoroEstado.fimTimestamp - Date.now());
            }
            pomodoroEstado.rodando = false;
            pomodoroEstado.fimTimestamp = null;
            if (pomodoroIntervalId) { clearInterval(pomodoroIntervalId); pomodoroIntervalId = null; }
            atualizarDisplayPomodoro();
            salvarEstadoPomodoro();
        }

        function alternarPomodoro() {
            if (pomodoroEstado.rodando) pausarPomodoro();
            else iniciarPomodoro();
        }

        function resetarPomodoro() {
            pausarPomodoro();
            pomodoroEstado.restanteMs = duracaoModoPomodoroMs(pomodoroEstado.modo);
            atualizarDisplayPomodoro();
            salvarEstadoPomodoro();
        }

        function pularPomodoro() {
            finalizarSessaoPomodoro(false);
        }

        function abrirPomodoro() {
            verificarNovoDiaPomodoro();
            document.getElementById('pomodoroOverlay').style.display = 'flex';
            atualizarDisplayPomodoro();
        }

        function fecharPomodoro() {
            document.getElementById('pomodoroOverlay').style.display = 'none';
        }

        function alternarConfigPomodoro() {
            const painel = document.getElementById('pomodoroConfigPainel');
            const abrindo = painel.style.display === 'none';
            if (abrindo) {
                document.getElementById('cfgFoco').value = pomodoroConfig.foco;
                document.getElementById('cfgPausaCurta').value = pomodoroConfig.pausaCurta;
                document.getElementById('cfgPausaLonga').value = pomodoroConfig.pausaLonga;
                document.getElementById('cfgCiclos').value = pomodoroConfig.ciclos;
                document.getElementById('cfgSom').checked = pomodoroConfig.som;
                document.getElementById('cfgAutoIniciar').checked = pomodoroConfig.autoIniciar;
            }
            painel.style.display = abrindo ? 'flex' : 'none';
        }

        function salvarConfigPomodoro() {
            pomodoroConfig.foco = Math.max(1, parseInt(document.getElementById('cfgFoco').value) || 25);
            pomodoroConfig.pausaCurta = Math.max(1, parseInt(document.getElementById('cfgPausaCurta').value) || 5);
            pomodoroConfig.pausaLonga = Math.max(1, parseInt(document.getElementById('cfgPausaLonga').value) || 15);
            pomodoroConfig.ciclos = Math.max(1, parseInt(document.getElementById('cfgCiclos').value) || 4);
            pomodoroConfig.som = document.getElementById('cfgSom').checked;
            pomodoroConfig.autoIniciar = document.getElementById('cfgAutoIniciar').checked;

            localStorage.setItem('estudo_ativo_pomodoro_config', JSON.stringify(pomodoroConfig));

            // Se o timer não estiver rodando, atualiza o tempo restante do modo atual pra refletir a nova duração
            if (!pomodoroEstado.rodando) {
                pomodoroEstado.restanteMs = duracaoModoPomodoroMs(pomodoroEstado.modo);
            }

            atualizarDisplayPomodoro();
            salvarEstadoPomodoro();
            document.getElementById('pomodoroConfigPainel').style.display = 'none';
            mostrarToast('⚙️ Configurações do Pomodoro salvas!', '#38a169');
        }

        carregarPomodoro();
    </script>

    <script>
        // Registra o Service Worker (cache offline + instalabilidade PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.log('Falha ao registrar o Service Worker:', err);
                });
            });
        }
    </script>
